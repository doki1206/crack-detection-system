<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d1a"/>
      <stop offset="40%" style="stop-color:#1a1a2e"/>
      <stop offset="70%" style="stop-color:#2d1f0a"/>
      <stop offset="100%" style="stop-color:#1a1206"/>
    </linearGradient>
    <linearGradient id="sunGlow" cx="50%" cy="30%" r="50%" fx="50%" fy="30%" gradientUnits="objectBoundingBox">
      <stop offset="0%" style="stop-color:#C8924B;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#C8924B;stop-opacity:0"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e8a84c;stop-opacity:0.8"/>
      <stop offset="40%" style="stop-color:#C8924B;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#C8924B;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a1f0d"/>
      <stop offset="100%" style="stop-color:#1a1206"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="mountainClip">
      <path d="M0,550 L200,300 L350,450 L500,250 L650,380 L800,200 L950,350 L1100,180 L1250,300 L1440,150 L1440,900 L0,900 Z"/>
    </clipPath>
  </defs>

  <!-- Sky -->
  <rect width="1440" height="900" fill="url(#skyGrad)"/>
  
  <!-- Stars -->
  <g fill="white" opacity="0.6">
    <circle cx="100" cy="60" r="1.2"/><circle cx="250" cy="90" r="0.8"/>
    <circle cx="400" cy="40" r="1"/><circle cx="550" cy="110" r="0.7"/>
    <circle cx="700" cy="50" r="1.3"/><circle cx="850" cy="85" r="0.9"/>
    <circle cx="1000" cy="35" r="1.1"/><circle cx="1150" cy="95" r="0.6"/>
    <circle cx="1300" cy="55" r="1"/><circle cx="1400" cy="75" r="0.8"/>
    <circle cx="180" cy="150" r="0.5"/><circle cx="320" cy="180" r="0.7"/>
    <circle cx="600" cy="140" r="0.6"/><circle cx="900" cy="160" r="0.5"/>
    <circle cx="1200" cy="130" r="0.9"/><circle cx="1380" cy="170" r="0.6"/>
    <circle cx="450" cy="200" r="0.4"/><circle cx="780" cy="190" r="0.5"/>
  </g>

  <!-- Sun glow -->
  <circle cx="1080" cy="180" r="200" fill="url(#sunGlow)" filter="url(#softGlow)"/>
  <circle cx="1080" cy="180" r="60" fill="url(#sun)"/>

  <!-- Distant mountains layer 1 (dark) -->
  <path d="M0,520 Q100,480 200,450 Q300,420 400,440 Q500,460 600,430 Q700,400 800,420 Q900,440 1000,410 Q1100,380 1200,400 Q1300,420 1440,390 L1440,900 L0,900 Z" fill="#1a1510" opacity="0.8"/>

  <!-- Distant mountains layer 2 -->
  <path d="M0,560 L150,400 L280,480 L400,350 L520,450 L650,380 L780,420 L900,360 L1050,450 L1200,380 L1320,440 L1440,400 L1440,900 L0,900 Z" fill="#251a0c" opacity="0.7"/>

  <!-- Mid mountains -->
  <path d="M0,600 L100,480 L220,550 L350,430 L480,530 L600,460 L750,500 L880,420 L1020,510 L1150,450 L1280,520 L1440,480 L1440,900 L0,900 Z" fill="#2a1f0d"/>

  <!-- Ground surface -->
  <path d="M0,650 L200,620 L400,640 L600,610 L800,630 L1000,620 L1200,640 L1440,610 L1440,900 L0,900 Z" fill="url(#groundGrad)"/>

  <!-- Ground cracks -->
  <g stroke="#C8924B" stroke-width="1.5" fill="none" opacity="0.4" stroke-linecap="round">
    <path d="M200,660 Q220,670 210,685 Q200,700 215,720"/>
    <path d="M210,685 Q230,690 240,710"/>
    <path d="M600,645 Q610,660 605,680 Q600,700 610,720 Q620,740 615,760"/>
    <path d="M605,680 Q625,685 630,700"/>
    <path d="M900,630 Q920,645 910,665 Q900,685 915,710"/>
    <path d="M910,665 Q930,670 940,690"/>
    <path d="M1100,640 Q1115,655 1110,675 Q1105,695 1120,715"/>
    <path d="M400,650 Q420,665 410,680"/>
    <path d="M1300,625 Q1320,640 1310,660"/>
  </g>

  <!-- Deeper cracks -->
  <g stroke="#1a1206" stroke-width="2.5" fill="none" opacity="0.6" stroke-linecap="round">
    <path d="M300,670 Q320,690 310,720 Q300,750 320,780"/>
    <path d="M750,650 Q770,670 760,700 Q750,730 770,760"/>
    <path d="M1050,660 Q1070,680 1060,710"/>
  </g>

  <!-- Drone SVG -->
  <g transform="translate(320, 200) rotate(-8)" filter="url(#glow)">
    <!-- Drone body -->
    <ellipse cx="0" cy="0" rx="18" ry="10" fill="#2a2a2a" stroke="#444" stroke-width="0.5"/>
    <!-- Arms -->
    <g stroke="#555" stroke-width="2" stroke-linecap="round">
      <line x1="-12" y1="-5" x2="-35" y2="-20"/>
      <line x1="12" y1="-5" x2="35" y2="-20"/>
      <line x1="-12" y1="5" x2="-35" y2="20"/>
      <line x1="12" y1="5" x2="35" y2="20"/>
    </g>
    <!-- Rotors -->
    <g>
      <ellipse cx="-35" cy="-20" rx="14" ry="4" fill="none" stroke="#C8924B" stroke-width="0.8" opacity="0.7"/>
      <ellipse cx="35" cy="-20" rx="14" ry="4" fill="none" stroke="#C8924B" stroke-width="0.8" opacity="0.7"/>
      <ellipse cx="-35" cy="20" rx="14" ry="4" fill="none" stroke="#C8924B" stroke-width="0.8" opacity="0.7"/>
      <ellipse cx="35" cy="20" rx="14" ry="4" fill="none" stroke="#C8924B" stroke-width="0.8" opacity="0.7"/>
    </g>
    <!-- Camera -->
    <rect x="-4" y="6" width="8" height="6" rx="2" fill="#1a1a1a" stroke="#C8924B" stroke-width="0.5"/>
    <circle cx="0" cy="9" r="2" fill="#333" stroke="#C8924B" stroke-width="0.3"/>
    <!-- Blinking light -->
    <circle cx="0" cy="-8" r="2" fill="#C8924B" opacity="0.9"/>
    <circle cx="0" cy="-8" r="5" fill="#C8924B" opacity="0.2"/>
  </g>

  <!-- Small drone in distance -->
  <g transform="translate(850, 350) scale(0.3) rotate(-12)" filter="url(#glow)" opacity="0.4">
    <ellipse cx="0" cy="0" rx="18" ry="10" fill="#2a2a2a" stroke="#444" stroke-width="0.5"/>
    <line x1="-12" y1="-5" x2="-35" y2="-20" stroke="#555" stroke-width="2"/>
    <line x1="12" y1="-5" x2="35" y2="-20" stroke="#555" stroke-width="2"/>
    <line x1="-12" y1="5" x2="-35" y2="20" stroke="#555" stroke-width="2"/>
    <line x1="12" y1="5" x2="35" y2="20" stroke="#555" stroke-width="2"/>
    <ellipse cx="-35" cy="-20" rx="14" ry="4" fill="none" stroke="#C8924B" stroke-width="0.8" opacity="0.7"/>
    <ellipse cx="35" cy="-20" rx="14" ry="4" fill="none" stroke="#C8924B" stroke-width="0.8" opacity="0.7"/>
    <ellipse cx="-35" cy="20" rx="14" ry="4" fill="none" stroke="#C8924B" stroke-width="0.8" opacity="0.7"/>
    <ellipse cx="35" cy="20" rx="14" ry="4" fill="none" stroke="#C8924B" stroke-width="0.8" opacity="0.7"/>
  </g>

  <!-- Bottom gradient overlay -->
  <rect x="0" y="750" width="1440" height="150" fill="url(#groundGrad)" opacity="0.8"/>
</svg>